name: Testes do Laboratório de Eletrônica

on:
  pull_request:
  push:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar sintaxe JavaScript
        run: |
          node --check aprendizagem-core.js
          node --check plataforma.js
          node --check pratica-numerica.js
          node --check nuvem.js
          node --check progresso-sync-core.js
          node --check trilha.js
          node --check trilha-dados.js
          node --check trilha-progress-core.js
          node --check math-editor-core.js
          node --check teclado-matematico.js
          node --check calculadora.js
          node --check pratica-estruturada-core.js
          node --check pratica-estruturada.js
      - name: Testar calculadora, nuvem e teclado matemático
        run: node --test test-pratica-estruturada.cjs test-calculadora-mobile.cjs test-offline.cjs test-aprendizagem.cjs test-pratica-numerica.cjs test-calculadora.cjs test-sync.cjs test-worker.mjs test-teclado-matematico.cjs test-trilha-progress.cjs test-teclado-mobile.cjs test-progresso-sync.cjs test-login-retorno.cjs
